name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security audit
        run: composer audit

      - name: PHP syntax check (src)
        run: find src -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: PHP syntax check (stubs)
        run: find stubs -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: composer analyse

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest tests/Feature

  # Both real-DB jobs below are blocking. They exercise only the
  # migration-sensitive slice (not the whole suite) to keep CI time reasonable,
  # so a red result here means the migration chain is genuinely broken on a real
  # MySQL/MariaDB server — not that the slice is too wide.
  test-mysql:
    name: Tests — MySQL 8 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: starter_kit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # DB_CONNECTION doubles as the guard: tests/MigrationTestCase skips itself
      # unless the resolved driver is mysql/mariadb, so this slice only ever
      # executes here and in the MariaDB job — never in the SQLite `test` job.
      - name: Run migration-sensitive tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: starter_kit_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest tests/Feature/Migration

  test-mariadb:
    name: Tests — MariaDB 11 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: starter_kit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # DB_CONNECTION is `mariadb`, NOT `mysql`: the two drivers compile `uuid`
      # differently (MySQL -> char(36), MariaDB >= 10.7 -> a native 16-byte
      # uuid), and that divergence is the whole reason this job exists. Running
      # MariaDB through the mysql driver would emit MySQL DDL and hide it.
      - name: Run migration-sensitive tests (MariaDB)
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: starter_kit_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest tests/Feature/Migration

  node:
    name: Node (Frontend Quality)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            stubs/node_modules
          key: node-22-${{ hashFiles('stubs/package-lock.json') }}
          restore-keys: node-22-

      - name: Install dependencies
        working-directory: stubs
        run: npm ci

      - name: Security audit
        working-directory: stubs
        run: npm audit --audit-level=high --omit=dev

      # Visibility only. The gate above blocks on high/critical; this step keeps
      # moderate/low advisories readable in the log without making them red.
      - name: Security audit report (moderate/low — non-blocking)
        working-directory: stubs
        run: npm audit --omit=dev || true

      - name: Create vendor symlink for @lvntr resolution
        working-directory: stubs
        run: mkdir -p vendor/lvntr && ln -s ${{ github.workspace }} vendor/lvntr/laravel-starter-kit

      - name: Generate Wayfinder route stubs (CI fallback — no PHP available)
        run: node scripts/ci/generate-route-stubs.mjs

      - name: Build (Vite)
        working-directory: stubs
        run: npm run build

      - name: Bundle budget
        run: node scripts/ci/check-bundle-budget.mjs

      - name: Typecheck (vue-tsc)
        working-directory: stubs
        run: npm run typecheck --if-present

      - name: Lint (ESLint)
        working-directory: stubs
        run: npm run lint:ci

      - name: Lint (ESLint) — package library
        run: npm run lint:lib

      - name: Test (Vitest)
        working-directory: stubs
        run: npm run test --if-present

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install root npm dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # scripts/bootstrap-fixture-app.sh starts the fixture app's dev
      # server as a background process itself and only blocks in the
      # foreground until /login answers, then exits — it is not a
      # long-running command. On success it appends E2E_BASE_URL /
      # E2E_FIXTURE_DIR to $GITHUB_ENV for the steps below.
      - name: Provision fixture app
        run: bash scripts/bootstrap-fixture-app.sh

      - name: Run Playwright smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  changelog-sync:
    name: Changelog sync (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert tag version is documented in all changelogs
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MISSING=0

          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::missing heading for v${VERSION}"
            MISSING=1
          fi

          for f in docs/CHANGELOG.md docs/CHANGELOG.tr.md; do
            if ! grep -qE "^## .* — v${VERSION}$" "$f"; then
              echo "::error file=$f::missing heading for v${VERSION}"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "Changelog drift detected for tag v${VERSION}." >&2
            exit 1
          fi
